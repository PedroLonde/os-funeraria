<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordens de Serviço</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #181818;
    --surface2: #222222;
    --border: #2a2a2a;
    --border2: #333;
    --text: #e8e4de;
    --text2: #8a8480;
    --text3: #555;
    --accent: #c8a96e;
    --accent2: #a08040;
    --danger: #c05a5a;
    --success: #5a9c6e;
    --warn: #c09050;
    --info: #5a7ab0;
    --radius: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 13px;
  }

  /* ── LOGIN ── */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--bg);
  }

  .login-box {
    width: 340px;
    padding: 48px 40px;
    border: 1px solid var(--border2);
    background: var(--surface);
  }

  .login-box h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    color: var(--accent);
    margin-bottom: 4px;
    letter-spacing: -0.5px;
  }

  .login-box p {
    color: var(--text2);
    font-size: 11px;
    margin-bottom: 32px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }

  input, select, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 10px 12px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  select option { background: var(--surface); }
  textarea { resize: vertical; min-height: 70px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    border-radius: var(--radius);
    transition: all 0.15s;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); color: #0f0f0f; border-color: var(--accent); font-weight: 500; }
  .btn-primary:hover { background: var(--accent2); border-color: var(--accent2); color: #0f0f0f; }
  .btn-danger { border-color: var(--danger); color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn-success { border-color: var(--success); color: var(--success); }
  .btn-success:hover { background: var(--success); color: #fff; }
  .btn-sm { padding: 5px 10px; font-size: 11px; }
  .btn-full { width: 100%; justify-content: center; }

  /* ── LAYOUT ── */
  #app { display: none; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topbar-brand {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    color: var(--accent);
    letter-spacing: -0.3px;
  }

  .topbar-user {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text2);
    font-size: 11px;
  }

  .badge-perfil {
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge-admin { background: #2a1f0a; color: var(--accent); border: 1px solid #3a2f1a; }
  .badge-agente { background: #0a1f2a; color: var(--info); border: 1px solid #1a2f3a; }
  .badge-motorista { background: #0a2a1a; color: var(--success); border: 1px solid #1a3a2a; }
  .badge-visualizador { background: #1a1a2a; color: #8a8ac0; border: 1px solid #2a2a3a; }

  .nav {
    display: flex;
    gap: 2px;
    padding: 12px 24px 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .nav-item {
    padding: 8px 16px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text2);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    margin-bottom: -1px;
  }
  .nav-item:hover { color: var(--text); }
  .nav-item.active { color: var(--accent); border-bottom-color: var(--accent); }

  .content { padding: 24px; max-width: 1400px; }

  .page { display: none; }
  .page.active { display: block; }

  /* ── CARDS / TABELAS ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 16px;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }

  .card-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text2);
  }

  .card-body { padding: 18px; }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    padding: 8px 12px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text3);
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }

  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .tag-aberta { background: #0a1f2a; color: var(--info); }
  .tag-em_andamento { background: #2a1f0a; color: var(--warn); }
  .tag-concluida { background: #0a2a1a; color: var(--success); }
  .tag-pendente { background: #1a1a1a; color: var(--text3); }
  .tag-cancelada { background: #2a0a0a; color: var(--danger); }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 200;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    width: 100%;
    max-width: 700px;
    position: relative;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
  }

  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    color: var(--accent);
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text2);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
  }
  .modal-close:hover { color: var(--text); }

  .modal-body { padding: 22px; }
  .modal-footer {
    padding: 16px 22px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  /* ── ITENS OS ── */
  .itens-list { display: flex; flex-direction: column; gap: 10px; }

  .item-row {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
  }

  .item-row-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .item-num {
    font-size: 10px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  /* ── OS CARD ── */
  .os-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
  }

  .os-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
  }
  .os-card-header:hover { background: var(--surface2); }

  .os-id {
    font-family: 'DM Serif Display', serif;
    font-size: 16px;
    color: var(--accent);
  }

  .os-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11px;
    color: var(--text2);
  }

  .os-body {
    display: none;
    border-top: 1px solid var(--border);
    padding: 16px 18px;
  }
  .os-body.open { display: block; }

  .item-detail {
    display: grid;
    grid-template-columns: 160px 1fr 1fr auto;
    gap: 8px;
    align-items: center;
    padding: 8px 10px;
    background: var(--bg);
    border-radius: var(--radius);
    margin-bottom: 6px;
    font-size: 12px;
  }

  .item-tipo {
    font-weight: 500;
    color: var(--accent);
    font-size: 11px;
    text-transform: uppercase;
  }

  .item-fornecedor { color: var(--text); }
  .item-local { color: var(--text2); font-size: 11px; }

  /* ── FILTROS ── */
  .filter-bar {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .filter-bar .field { margin-bottom: 0; flex: 1; min-width: 140px; }

  /* ── ALERTS ── */
  .alert {
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 12px;
    margin-bottom: 14px;
    display: none;
  }
  .alert.show { display: block; }
  .alert-error { background: #2a0a0a; border: 1px solid #4a1a1a; color: #e08080; }
  .alert-success { background: #0a2a1a; border: 1px solid #1a3a2a; color: #80c090; }

  /* ── LOG ── */
  .log-row td { font-size: 11px; }
  .log-dados { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text3); }

  /* ── EMPTY ── */
  .empty {
    text-align: center;
    padding: 48px;
    color: var(--text3);
    font-size: 12px;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 16px 0;
  }

  .row { display: flex; gap: 10px; align-items: center; }
  .flex-1 { flex: 1; }

  .search-input-wrap { position: relative; }
  .search-input-wrap input { padding-left: 32px; }
  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    font-size: 12px;
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  @media (max-width: 600px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .item-detail { grid-template-columns: 1fr; }
    .filter-bar { flex-direction: column; }
    .topbar-brand { font-size: 15px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>OS Sistema</h1>
    <p>Ordens de Serviço</p>
    <div id="login-alert" class="alert alert-error"></div>
    <div class="field">
      <label>Login</label>
      <input type="text" id="login-input" placeholder="seu.login" autocomplete="username">
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="senha-input" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-full" style="margin-top:8px" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <span class="topbar-brand">OS Sistema</span>
    <div class="topbar-user">
      <span id="user-nome"></span>
      <span id="user-badge" class="badge-perfil"></span>
      <button class="btn btn-sm" onclick="doLogout()">Sair</button>
    </div>
  </div>

  <div class="nav" id="nav-bar"></div>

  <div class="content">

    <!-- PÁGINA: OS -->
    <div class="page active" id="page-os">
      <div class="filter-bar">
        <div class="field">
          <label>Buscar ID Web Luto</label>
          <div class="search-input-wrap">
            <span class="search-icon">⌕</span>
            <input type="text" id="busca-os" placeholder="Digite o ID..." oninput="renderOS()">
          </div>
        </div>
        <div class="field">
          <label>Status</label>
          <select id="filtro-status" onchange="renderOS()">
            <option value="">Todos</option>
            <option value="aberta">Aberta</option>
            <option value="em_andamento">Em Andamento</option>
            <option value="concluida">Concluída</option>
          </select>
        </div>
        <div id="btn-nova-os"></div>
      </div>
      <div id="lista-os"></div>
    </div>

    <!-- PÁGINA: EXPORTAR -->
    <div class="page" id="page-exportar">
      <div class="card" style="max-width:500px">
        <div class="card-header"><span class="card-title">Exportar Relatório</span></div>
        <div class="card-body">
          <div class="grid-2">
            <div class="field">
              <label>Data inicial</label>
              <input type="date" id="exp-data-ini">
            </div>
            <div class="field">
              <label>Data final</label>
              <input type="date" id="exp-data-fim">
            </div>
          </div>
          <div class="field">
            <label>Fornecedor (deixe vazio para todos)</label>
            <input type="text" id="exp-fornecedor" placeholder="Ex: Ailton, Egnalos...">
          </div>
          <button class="btn btn-primary btn-full" onclick="exportar()">⬇ Baixar CSV (Excel)</button>
        </div>
      </div>
    </div>

    <!-- PÁGINA: FORNECEDORES -->
    <div class="page" id="page-fornecedores">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Fornecedores</span>
          <button class="btn btn-sm btn-primary" onclick="abrirModalFornecedor()">+ Novo</button>
        </div>
        <div style="overflow-x:auto">
          <table id="tabela-fornecedores">
            <thead><tr><th>Nome</th><th>Tipo de Serviço</th><th>Contato</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- PÁGINA: USUÁRIOS (admin) -->
    <div class="page" id="page-usuarios">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Usuários</span>
          <button class="btn btn-sm btn-primary" onclick="abrirModalUsuario()">+ Novo</button>
        </div>
        <div style="overflow-x:auto">
          <table id="tabela-usuarios">
            <thead><tr><th>Nome</th><th>Login</th><th>Perfil</th><th>Ativo</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- PÁGINA: LOGS (admin) -->
    <div class="page" id="page-logs">
      <div class="card">
        <div class="card-header"><span class="card-title">Log de Alterações</span></div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>Data/Hora</th><th>Usuário</th><th>Ação</th><th>Antes</th><th>Depois</th></tr></thead>
            <tbody id="tbody-logs"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div><!-- /content -->
</div><!-- /app -->

<!-- MODAL: NOVA/EDITAR OS -->
<div class="modal-overlay" id="modal-os">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-os-titulo">Nova Ordem de Serviço</span>
      <button class="modal-close" onclick="fecharModal('modal-os')">×</button>
    </div>
    <div class="modal-body">
      <div id="os-alert" class="alert alert-error"></div>
      <input type="hidden" id="os-id-edit">
      <div class="grid-2">
        <div class="field">
          <label>ID Web Luto *</label>
          <input type="text" id="os-webluto" placeholder="Ex: WL-2024-001">
        </div>
        <div class="field">
          <label>Status</label>
          <select id="os-status">
            <option value="aberta">Aberta</option>
            <option value="em_andamento">Em Andamento</option>
            <option value="concluida">Concluída</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Observações</label>
        <textarea id="os-obs" placeholder="Informações adicionais..."></textarea>
      </div>
      <div class="divider"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <span style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text2)">Itens</span>
        <button class="btn btn-sm" onclick="addItem()">+ Item</button>
      </div>
      <div class="itens-list" id="itens-container"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="fecharModal('modal-os')">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarOS()">Salvar OS</button>
    </div>
  </div>
</div>

<!-- MODAL: FORNECEDOR -->
<div class="modal-overlay" id="modal-fornecedor">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <span class="modal-title">Fornecedor</span>
      <button class="modal-close" onclick="fecharModal('modal-fornecedor')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="forn-id-edit">
      <div class="field"><label>Nome *</label><input type="text" id="forn-nome"></div>
      <div class="field"><label>Tipo de Serviço</label><input type="text" id="forn-tipo" placeholder="Ex: Tanato, Coroa, Urna..."></div>
      <div class="field"><label>Contato</label><input type="text" id="forn-contato" placeholder="Telefone ou e-mail"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="fecharModal('modal-fornecedor')">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarFornecedor()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL: USUÁRIO -->
<div class="modal-overlay" id="modal-usuario">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <span class="modal-title">Usuário</span>
      <button class="modal-close" onclick="fecharModal('modal-usuario')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="usr-id-edit">
      <div class="field"><label>Nome *</label><input type="text" id="usr-nome"></div>
      <div class="field"><label>Login *</label><input type="text" id="usr-login"></div>
      <div class="field"><label>Senha <span id="usr-senha-hint" style="color:var(--text3);font-size:10px">(obrigatório)</span></label><input type="password" id="usr-senha" placeholder="Mínimo 6 caracteres"></div>
      <div class="field">
        <label>Perfil</label>
        <select id="usr-perfil">
          <option value="agente">Agente</option>
          <option value="motorista">Motorista</option>
          <option value="visualizador">Visualizador</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="field">
        <label>Ativo</label>
        <select id="usr-ativo"><option value="1">Sim</option><option value="0">Não</option></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="fecharModal('modal-usuario')">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarUsuario()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL: ATRIBUIR MOTORISTA -->
<div class="modal-overlay" id="modal-atribuir">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <span class="modal-title">Atribuir Motorista</span>
      <button class="modal-close" onclick="fecharModal('modal-atribuir')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="atr-item-id">
      <p style="font-size:12px;color:var(--text2);margin-bottom:16px" id="atr-descricao"></p>
      <div class="field">
        <label>Motorista</label>
        <select id="atr-motorista"></select>
      </div>
      <div class="field">
        <label>Status do Item</label>
        <select id="atr-status">
          <option value="pendente">Pendente</option>
          <option value="em_andamento">Em Andamento</option>
          <option value="concluida">Concluído</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="fecharModal('modal-atribuir')">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarAtribuicao()">Confirmar</button>
    </div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
let state = {
  user: null,
  os: [],
  fornecedores: [],
  motoristas: [],
  usuarios: []
};

// ── API ────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include'
  };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch('/api' + path, opts);
  const data = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, data };
}

// ── AUTH ───────────────────────────────────────────────────────────────────
async function doLogin() {
  const login = document.getElementById('login-input').value.trim();
  const senha = document.getElementById('senha-input').value;
  if (!login || !senha) return showAlert('login-alert', 'Preencha login e senha');

  const r = await api('POST', '/login', { login, senha });
  if (r.ok) {
    state.user = r.data;
    iniciarApp();
  } else {
    showAlert('login-alert', r.data.msg || 'Erro ao fazer login');
  }
}

document.getElementById('senha-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('login-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogout() {
  await api('POST', '/logout');
  state.user = null;
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

async function checkSession() {
  const r = await api('GET', '/me');
  if (r.ok) {
    state.user = r.data;
    iniciarApp();
  }
}

// ── APP INIT ───────────────────────────────────────────────────────────────
async function iniciarApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-nome').textContent = state.user.nome;

  const badge = document.getElementById('user-badge');
  badge.textContent = state.user.perfil;
  badge.className = 'badge-perfil badge-' + state.user.perfil;

  buildNav();
  await carregarDados();
  mostrarPagina('os');
}

function buildNav() {
  const p = state.user.perfil;
  const nav = document.getElementById('nav-bar');
  nav.innerHTML = '';

  const items = [{ id: 'os', label: 'Ordens de Serviço' }];

  if (p === 'admin' || p === 'agente' || p === 'visualizador') {
    items.push({ id: 'exportar', label: 'Exportar' });
  }
  if (p === 'admin' || p === 'agente') {
    items.push({ id: 'fornecedores', label: 'Fornecedores' });
  }
  if (p === 'admin') {
    items.push({ id: 'usuarios', label: 'Usuários' });
    items.push({ id: 'logs', label: 'Logs' });
  }

  items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'nav-item';
    el.textContent = item.label;
    el.dataset.page = item.id;
    el.onclick = () => mostrarPagina(item.id);
    nav.appendChild(el);
  });
}

function mostrarPagina(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + id)?.classList.add('active');
  document.querySelector(`[data-page="${id}"]`)?.classList.add('active');

  if (id === 'os') renderOS();
  if (id === 'fornecedores') renderFornecedores();
  if (id === 'usuarios') renderUsuarios();
  if (id === 'logs') carregarLogs();
}

async function carregarDados() {
  const [osR, fornR, motR] = await Promise.all([
    api('GET', '/os'),
    api('GET', '/fornecedores'),
    api('GET', '/motoristas')
  ]);
  if (osR.ok) state.os = osR.data;
  if (fornR.ok) state.fornecedores = fornR.data;
  if (motR.ok) state.motoristas = motR.data;

  if (state.user.perfil === 'admin') {
    const usrR = await api('GET', '/usuarios');
    if (usrR.ok) state.usuarios = usrR.data;
  }
}

// ── OS ─────────────────────────────────────────────────────────────────────
function renderOS() {
  const container = document.getElementById('lista-os');
  const busca = document.getElementById('busca-os').value.toLowerCase();
  const filtroStatus = document.getElementById('filtro-status').value;

  // Botão nova OS
  const btnWrap = document.getElementById('btn-nova-os');
  if (state.user.perfil === 'agente' || state.user.perfil === 'admin') {
    btnWrap.innerHTML = '<button class="btn btn-primary" onclick="abrirModalOS()">+ Nova OS</button>';
  }

  let lista = state.os;
  if (busca) lista = lista.filter(o => o.id_webluto.toLowerCase().includes(busca));
  if (filtroStatus) lista = lista.filter(o => o.status === filtroStatus);

  if (!lista.length) {
    container.innerHTML = '<div class="empty">Nenhuma ordem de serviço encontrada.</div>';
    return;
  }

  container.innerHTML = lista.map(os => `
    <div class="os-card">
      <div class="os-card-header" onclick="toggleOS(${os.id})">
        <div style="display:flex;align-items:center;gap:14px">
          <span class="os-id">${os.id_webluto}</span>
          <span class="tag tag-${os.status}">${os.status.replace('_',' ')}</span>
        </div>
        <div class="os-meta">
          <span>${os.agente_nome}</span>
          <span>${formatDate(os.criado_em)}</span>
          <span style="color:var(--text3)">${os.itens.length} item(s)</span>
          ${(state.user.perfil === 'agente' || state.user.perfil === 'admin') ? `
            <button class="btn btn-sm" onclick="event.stopPropagation();editarOS(${os.id})">Editar</button>
          ` : ''}
        </div>
      </div>
      <div class="os-body" id="os-body-${os.id}">
        ${os.observacoes ? `<p style="font-size:12px;color:var(--text2);margin-bottom:12px">${os.observacoes}</p>` : ''}
        ${os.itens.map(item => `
          <div class="item-detail">
            <span class="item-tipo">${item.tipo_servico}</span>
            <span class="item-fornecedor">${item.fornecedor_nome || '—'} ${item.local_execucao ? '<br><span class="item-local">'+item.local_execucao+'</span>' : ''}</span>
            <span>
              <span class="tag tag-${item.status}">${item.status.replace('_',' ')}</span>
              ${item.motorista_nome ? `<br><span style="font-size:11px;color:var(--text2);margin-top:4px;display:block">🚗 ${item.motorista_nome}</span>` : ''}
            </span>
            ${(state.user.perfil === 'motorista' || state.user.perfil === 'admin') ? `
              <button class="btn btn-sm" onclick="abrirAtribuir(${item.id}, '${item.tipo_servico}', '${item.fornecedor_nome||''}')">Atribuir</button>
            ` : '<span></span>'}
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function toggleOS(id) {
  const body = document.getElementById('os-body-' + id);
  body.classList.toggle('open');
}

// ── MODAL OS ───────────────────────────────────────────────────────────────
let itemCount = 0;

function abrirModalOS() {
  itemCount = 0;
  document.getElementById('os-id-edit').value = '';
  document.getElementById('os-webluto').value = '';
  document.getElementById('os-obs').value = '';
  document.getElementById('os-status').value = 'aberta';
  document.getElementById('itens-container').innerHTML = '';
  document.getElementById('modal-os-titulo').textContent = 'Nova Ordem de Serviço';
  hideAlert('os-alert');
  addItem();
  abrirModal('modal-os');
}

function editarOS(id) {
  const os = state.os.find(o => o.id === id);
  if (!os) return;
  itemCount = 0;
  document.getElementById('os-id-edit').value = os.id;
  document.getElementById('os-webluto').value = os.id_webluto;
  document.getElementById('os-obs').value = os.observacoes || '';
  document.getElementById('os-status').value = os.status;
  document.getElementById('modal-os-titulo').textContent = 'Editar OS — ' + os.id_webluto;
  document.getElementById('itens-container').innerHTML = '';
  hideAlert('os-alert');

  os.itens.forEach(item => {
    addItem();
    const idx = itemCount;
    document.getElementById(`item-tipo-${idx}`).value = item.tipo_servico;
    document.getElementById(`item-forn-${idx}`).value = item.fornecedor_nome || '';
    document.getElementById(`item-local-${idx}`).value = item.local_execucao || '';
    document.getElementById(`item-obs-${idx}`).value = item.observacao || '';
    document.getElementById(`item-status-${idx}`).value = item.status;
    // fornecedor_id
    const sel = document.getElementById(`item-forn-sel-${idx}`);
    if (sel && item.fornecedor_id) sel.value = item.fornecedor_id;
  });

  abrirModal('modal-os');
}

function addItem() {
  itemCount++;
  const idx = itemCount;
  const container = document.getElementById('itens-container');

  const tiposServico = ['Tanato', 'Coroa de Flores', 'Urna', 'Ornamentação', 'Traslado', 'Translado', 'Velório', 'Cremação', 'Outro'];

  const div = document.createElement('div');
  div.className = 'item-row';
  div.id = `item-row-${idx}`;
  div.innerHTML = `
    <div class="item-row-header">
      <span class="item-num">Item ${idx}</span>
      <button class="btn btn-sm btn-danger" onclick="removerItem(${idx})">Remover</button>
    </div>
    <div class="grid-2">
      <div class="field">
        <label>Tipo de Serviço *</label>
        <input list="tipos-list-${idx}" id="item-tipo-${idx}" placeholder="Ex: Tanato, Coroa...">
        <datalist id="tipos-list-${idx}">
          ${tiposServico.map(t => `<option value="${t}">`).join('')}
        </datalist>
      </div>
      <div class="field">
        <label>Fornecedor *</label>
        <select id="item-forn-sel-${idx}" onchange="onFornChange(${idx})">
          <option value="">Selecione ou digite abaixo</option>
          ${state.fornecedores.map(f => `<option value="${f.id}" data-nome="${f.nome}">${f.nome}</option>`).join('')}
          <option value="_outro">Outro (digitar)</option>
        </select>
      </div>
    </div>
    <div class="grid-2">
      <div class="field">
        <label>Nome do Fornecedor (confirme ou edite)</label>
        <input type="text" id="item-forn-${idx}" placeholder="Nome do fornecedor">
      </div>
      <div class="field">
        <label>Local / Endereço</label>
        <input type="text" id="item-local-${idx}" placeholder="Onde retirar ou executar">
      </div>
    </div>
    <div class="grid-2">
      <div class="field">
        <label>Status</label>
        <select id="item-status-${idx}">
          <option value="pendente">Pendente</option>
          <option value="em_andamento">Em Andamento</option>
          <option value="concluida">Concluído</option>
        </select>
      </div>
      <div class="field">
        <label>Observação</label>
        <input type="text" id="item-obs-${idx}" placeholder="Detalhe adicional">
      </div>
    </div>
  `;
  container.appendChild(div);
}

function onFornChange(idx) {
  const sel = document.getElementById(`item-forn-sel-${idx}`);
  const inp = document.getElementById(`item-forn-${idx}`);
  if (sel.value && sel.value !== '_outro') {
    const opt = sel.options[sel.selectedIndex];
    inp.value = opt.dataset.nome;
  } else if (sel.value === '_outro') {
    inp.value = '';
    inp.focus();
  }
}

function removerItem(idx) {
  document.getElementById(`item-row-${idx}`)?.remove();
}

async function salvarOS() {
  const idEdit = document.getElementById('os-id-edit').value;
  const webluto = document.getElementById('os-webluto').value.trim();
  if (!webluto) return showAlert('os-alert', 'ID Web Luto é obrigatório');

  const itens = [];
  document.querySelectorAll('.item-row').forEach(row => {
    const idx = row.id.replace('item-row-', '');
    const tipo = document.getElementById(`item-tipo-${idx}`)?.value.trim();
    if (!tipo) return;
    const fornSel = document.getElementById(`item-forn-sel-${idx}`);
    const fornNome = document.getElementById(`item-forn-${idx}`)?.value.trim();
    itens.push({
      tipo_servico: tipo,
      fornecedor_id: (fornSel?.value && fornSel.value !== '_outro') ? parseInt(fornSel.value) : null,
      fornecedor_nome: fornNome,
      local_execucao: document.getElementById(`item-local-${idx}`)?.value.trim(),
      status: document.getElementById(`item-status-${idx}`)?.value,
      observacao: document.getElementById(`item-obs-${idx}`)?.value.trim()
    });
  });

  if (!itens.length) return showAlert('os-alert', 'Adicione pelo menos um item');

  const payload = {
    id_webluto: webluto,
    observacoes: document.getElementById('os-obs').value.trim(),
    status: document.getElementById('os-status').value,
    itens
  };

  let r;
  if (idEdit) {
    r = await api('PUT', `/os/${idEdit}`, payload);
  } else {
    r = await api('POST', '/os', payload);
  }

  if (r.data.ok) {
    fecharModal('modal-os');
    await carregarDados();
    renderOS();
  } else {
    showAlert('os-alert', r.data.msg || 'Erro ao salvar');
  }
}

// ── ATRIBUIR MOTORISTA ─────────────────────────────────────────────────────
function abrirAtribuir(itemId, tipo, fornecedor) {
  document.getElementById('atr-item-id').value = itemId;
  document.getElementById('atr-descricao').textContent = `${tipo} — ${fornecedor}`;

  const sel = document.getElementById('atr-motorista');
  sel.innerHTML = '<option value="">Nenhum</option>' +
    state.motoristas.map(m => `<option value="${m.id}">${m.nome}</option>`).join('');

  // pré-selecionar o próprio motorista
  if (state.user.perfil === 'motorista') {
    sel.value = state.user.id;
  }

  abrirModal('modal-atribuir');
}

async function salvarAtribuicao() {
  const itemId = document.getElementById('atr-item-id').value;
  const motoristaId = document.getElementById('atr-motorista').value || null;
  const status = document.getElementById('atr-status').value;

  const r = await api('POST', `/item/${itemId}/atribuir`, { motorista_id: motoristaId ? parseInt(motoristaId) : null, status });
  if (r.data.ok) {
    fecharModal('modal-atribuir');
    await carregarDados();
    renderOS();
  }
}

// ── FORNECEDORES ───────────────────────────────────────────────────────────
function renderFornecedores() {
  const tbody = document.querySelector('#tabela-fornecedores tbody');
  tbody.innerHTML = state.fornecedores.map(f => `
    <tr>
      <td>${f.nome}</td>
      <td>${f.tipo_servico || '—'}</td>
      <td>${f.contato || '—'}</td>
      <td><button class="btn btn-sm" onclick="editarFornecedor(${f.id})">Editar</button></td>
    </tr>
  `).join('') || '<tr><td colspan="4" class="empty">Nenhum fornecedor.</td></tr>';
}

function abrirModalFornecedor() {
  document.getElementById('forn-id-edit').value = '';
  document.getElementById('forn-nome').value = '';
  document.getElementById('forn-tipo').value = '';
  document.getElementById('forn-contato').value = '';
  abrirModal('modal-fornecedor');
}

function editarFornecedor(id) {
  const f = state.fornecedores.find(x => x.id === id);
  if (!f) return;
  document.getElementById('forn-id-edit').value = f.id;
  document.getElementById('forn-nome').value = f.nome;
  document.getElementById('forn-tipo').value = f.tipo_servico || '';
  document.getElementById('forn-contato').value = f.contato || '';
  abrirModal('modal-fornecedor');
}

async function salvarFornecedor() {
  const id = document.getElementById('forn-id-edit').value;
  const payload = {
    nome: document.getElementById('forn-nome').value.trim(),
    tipo_servico: document.getElementById('forn-tipo').value.trim(),
    contato: document.getElementById('forn-contato').value.trim()
  };
  if (!payload.nome) return alert('Nome é obrigatório');

  let r;
  if (id) r = await api('PUT', `/fornecedores/${id}`, payload);
  else r = await api('POST', '/fornecedores', payload);

  if (r.data.ok) {
    fecharModal('modal-fornecedor');
    const fr = await api('GET', '/fornecedores');
    if (fr.ok) state.fornecedores = fr.data;
    renderFornecedores();
  }
}

// ── USUÁRIOS ───────────────────────────────────────────────────────────────
function renderUsuarios() {
  const tbody = document.querySelector('#tabela-usuarios tbody');
  tbody.innerHTML = state.usuarios.map(u => `
    <tr>
      <td>${u.nome}</td>
      <td style="color:var(--text2)">${u.login}</td>
      <td><span class="badge-perfil badge-${u.perfil}">${u.perfil}</span></td>
      <td>${u.ativo ? '✓' : '✗'}</td>
      <td><button class="btn btn-sm" onclick="editarUsuario(${u.id})">Editar</button></td>
    </tr>
  `).join('') || '<tr><td colspan="5" class="empty">Nenhum usuário.</td></tr>';
}

function abrirModalUsuario() {
  document.getElementById('usr-id-edit').value = '';
  document.getElementById('usr-nome').value = '';
  document.getElementById('usr-login').value = '';
  document.getElementById('usr-senha').value = '';
  document.getElementById('usr-perfil').value = 'agente';
  document.getElementById('usr-ativo').value = '1';
  document.getElementById('usr-senha-hint').textContent = '(obrigatório)';
  document.getElementById('usr-login').removeAttribute('disabled');
  abrirModal('modal-usuario');
}

function editarUsuario(id) {
  const u = state.usuarios.find(x => x.id === id);
  if (!u) return;
  document.getElementById('usr-id-edit').value = u.id;
  document.getElementById('usr-nome').value = u.nome;
  document.getElementById('usr-login').value = u.login;
  document.getElementById('usr-senha').value = '';
  document.getElementById('usr-perfil').value = u.perfil;
  document.getElementById('usr-ativo').value = u.ativo;
  document.getElementById('usr-senha-hint').textContent = '(deixe vazio para não alterar)';
  document.getElementById('usr-login').setAttribute('disabled', true);
  abrirModal('modal-usuario');
}

async function salvarUsuario() {
  const id = document.getElementById('usr-id-edit').value;
  const payload = {
    nome: document.getElementById('usr-nome').value.trim(),
    login: document.getElementById('usr-login').value.trim(),
    senha: document.getElementById('usr-senha').value,
    perfil: document.getElementById('usr-perfil').value,
    ativo: parseInt(document.getElementById('usr-ativo').value)
  };

  if (!payload.nome) return alert('Nome é obrigatório');
  if (!id && !payload.senha) return alert('Senha é obrigatória para novo usuário');

  let r;
  if (id) r = await api('PUT', `/usuarios/${id}`, payload);
  else r = await api('POST', '/usuarios', payload);

  if (r.data.ok) {
    fecharModal('modal-usuario');
    const ur = await api('GET', '/usuarios');
    if (ur.ok) state.usuarios = ur.data;
    renderUsuarios();
  } else {
    alert(r.data.msg || 'Erro ao salvar');
  }
}

// ── EXPORTAR ───────────────────────────────────────────────────────────────
function exportar() {
  const ini = document.getElementById('exp-data-ini').value;
  const fim = document.getElementById('exp-data-fim').value;
  const forn = document.getElementById('exp-fornecedor').value;

  let url = '/api/exportar?';
  if (ini) url += `data_ini=${ini}&`;
  if (fim) url += `data_fim=${fim}&`;
  if (forn) url += `fornecedor=${encodeURIComponent(forn)}&`;

  window.location.href = url;
}

// ── LOGS ───────────────────────────────────────────────────────────────────
async function carregarLogs() {
  const r = await api('GET', '/logs');
  if (!r.ok) return;
  const tbody = document.getElementById('tbody-logs');
  tbody.innerHTML = r.data.map(l => `
    <tr class="log-row">
      <td>${formatDateTime(l.data_hora)}</td>
      <td>${l.usuario_nome}</td>
      <td>${l.acao}</td>
      <td class="log-dados">${l.dados_anteriores ? JSON.stringify(JSON.parse(l.dados_anteriores)).substring(0, 80) + '...' : '—'}</td>
      <td class="log-dados">${l.dados_novos ? JSON.stringify(JSON.parse(l.dados_novos)).substring(0, 80) + '...' : '—'}</td>
    </tr>
  `).join('') || '<tr><td colspan="5" class="empty">Nenhum log.</td></tr>';
}

// ── UTILITÁRIOS ────────────────────────────────────────────────────────────
function abrirModal(id) { document.getElementById(id).classList.add('open'); }
function fecharModal(id) { document.getElementById(id).classList.remove('open'); }

function showAlert(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('show');
}
function hideAlert(id) { document.getElementById(id)?.classList.remove('show'); }

function formatDate(str) {
  if (!str) return '';
  return str.substring(0, 10).split('-').reverse().join('/');
}
function formatDateTime(str) {
  if (!str) return '';
  return str.substring(0, 16).replace('T', ' ').replace(/-/g, '/');
}

// Fechar modal clicando fora
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

// ── INIT ───────────────────────────────────────────────────────────────────
checkSession();
</script>
</body>
</html>
